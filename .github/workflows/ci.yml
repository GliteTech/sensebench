name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src tests tools
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python tools/verify_prompt.py --all

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scoped to the files that carry outbound links we control. The Glite LENS 404 lived
      # in a Python string, not a markdown link, so baselines.py is included deliberately.
      - uses: lycheeverse/lychee-action@v2
        with:
          # --exclude-all-private drops the localhost vLLM example; the second exclude drops
          # the literal `http://...` placeholder in the self-hosted docs.
          args: >-
            --no-progress --max-retries 3 --exclude-all-private
            --exclude '^http://\.\.\.'
            README.md docs src/sensebench/leaderboard/baselines.py
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv venv /tmp/smoke-venv
      - run: uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
      - name: Installed-package smoke test outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          /tmp/smoke-venv/bin/sensebench render \
            --dataset-jsonl "$GITHUB_WORKSPACE/tests/data/smoke_items.jsonl" \
            --prompt p001 --limit 1 > render.json
          grep -q '<t>art</t>' render.json
