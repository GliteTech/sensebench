[project]
name = "sensebench"
version = "0.1.0"
description = "Glite SenseBench benchmark and leaderboard tooling for English word sense disambiguation evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Glite Tech Ltd", email = "info@glite.ai" },
]
maintainers = [
    { name = "Vassili Philippov", email = "vassili@glite.ai" },
]
keywords = [
    "benchmark",
    "evaluation",
    "leaderboard",
    "lexen",
    "llm",
    "nlp",
    "word-sense-disambiguation",
    "wsd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "datasets>=3.0",
    "litellm>=1.0",
    "nltk>=3.9",
    "numpy>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "scipy>=1.14",
]

[project.urls]
Homepage = "https://github.com/GliteTech/sensebench"
Repository = "https://github.com/GliteTech/sensebench"
Issues = "https://github.com/GliteTech/sensebench/issues"
Company = "https://glite.ai"

[project.scripts]
sensebench = "sensebench.cli:main"
sensebench-verify-prompt = "sensebench.verify.prompts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensebench"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
python_files = "test_*.py"
python_functions = "test_*"

[dependency-groups]
dev = [
    "flowmark>=0.6.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.flowmark]
width = 100
extend-exclude = [
    ".agents/",
]
